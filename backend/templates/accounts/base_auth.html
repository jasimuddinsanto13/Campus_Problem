{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Campus Problem{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            lime: '#C6FF00',
            limeSoft: '#F0FBD8',
            ink: '#1A1A1A',
            paper: '#F8F9F3',
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <style>
    /* Ambient glow drift */
    @keyframes blob-drift {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33%      { transform: translate(26px, -20px) scale(1.07); }
      66%      { transform: translate(-18px, 16px) scale(0.96); }
    }
    .auth-blob   { animation: blob-drift 18s ease-in-out infinite; }
    .auth-blob-2 { animation: blob-drift 24s ease-in-out infinite reverse; }
    .auth-blob-3 { animation: blob-drift 30s ease-in-out infinite; }

    /* Gentle card entrance */
    @keyframes card-in {
      from { opacity: 0; transform: translateY(14px) scale(.985); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    .auth-card-in { animation: card-in .55s cubic-bezier(.22, 1, .36, 1) both; }
  </style>
</head>
<body class="relative min-h-screen bg-paper font-sans text-ink antialiased selection:bg-lime/60">

  <!-- Ambient background: soft lime & cream glow blobs -->
  <div class="pointer-events-none fixed inset-0 z-0" aria-hidden="true">
    <div class="auth-blob absolute -left-36 -top-36 h-[30rem] w-[30rem] rounded-full bg-lime/25 blur-3xl"></div>
    <div class="auth-blob-2 absolute -right-44 top-1/4 h-[32rem] w-[32rem] rounded-full bg-lime/15 blur-3xl"></div>
    <div class="auth-blob-3 absolute -bottom-44 left-1/4 h-[28rem] w-[28rem] rounded-full bg-[#d9e8b8]/30 blur-3xl"></div>
    <div class="absolute inset-x-0 top-0 h-px bg-gradient-to-r from-transparent via-ink/15 to-transparent"></div>
    <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top,rgba(198,255,0,0.10),transparent_55%)]"></div>
  </div>

  <main class="relative z-10 flex min-h-screen px-4 py-12">
    <div class="m-auto w-full max-w-[440px]">

      {% if messages %}
        <div class="auth-card-in mb-5 grid gap-2.5">
          {% for message in messages %}
            <p class="rounded-2xl border border-ink/10 bg-white px-4 py-3 text-sm shadow-sm
                      {% if message.tags == 'success' %}text-emerald-700{% elif message.tags == 'warning' %}text-amber-700{% else %}text-rose-700{% endif %}">
              {{ message }}
            </p>
          {% endfor %}
        </div>
      {% endif %}

      <div class="auth-card-in rounded-3xl border border-ink/[0.07] bg-white p-8 shadow-[0_24px_60px_rgba(26,26,26,0.08)] sm:p-10">

        <div class="mb-9 text-center">
          <div class="mx-auto mb-5 flex h-12 w-12 items-center justify-center rounded-2xl bg-lime shadow-lg shadow-lime/40">
            <span class="text-base font-extrabold tracking-tight text-ink">CP</span>
          </div>
          {% block header %}{% endblock %}
        </div>

        {% block content %}{% endblock %}
      </div>

      <p class="mt-6 text-center text-xs tracking-wide text-neutral-400">Campus Problem · Student services</p>
    </div>
  </main>

  <script src="{% static 'auth.js' %}"></script>
</body>
</html>
